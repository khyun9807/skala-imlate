# =====================================================================
# 로컬 개발 전용 인프라 (MySQL 8 + Redis 7)
#
#   ※ 이 파일은 개발자 PC 에서만 사용한다. 운영 환경은 AWS RDS / ElastiCache 를
#     Terraform(infra/terraform) 으로 프로비저닝하며 이 compose 파일을 쓰지 않는다.
#   ※ 여기 적힌 계정/비밀번호는 로컬 전용 더미 값이다.
#
#   사용법
#     docker compose up -d          # 기동
#     docker compose ps             # 상태 확인 (healthy 확인 후 앱 실행)
#     docker compose logs -f mysql  # 로그
#     docker compose down           # 정지
#     docker compose down -v        # 정지 + 데이터 볼륨 삭제(초기화)
#
#   앱 실행: cd backend && ./gradlew bootRun --args='--spring.profiles.active=local'
#
#   ※ PC 에 이미 MySQL(3306) / Redis(6379) 가 설치·실행 중이면 포트가 충돌한다.
#     그럴 때는 프로젝트 루트에 .env 파일을 만들어 포트를 바꾼다(기존 서비스는 그대로 둔다).
#
#       IMLATE_MYSQL_PORT=13306
#       IMLATE_REDIS_PORT=16379
#
#     같은 .env 값을 Spring 도 읽도록, 앱 실행 시 아래 환경변수를 함께 준다.
#       IMLATE_DB_URL=jdbc:mysql://localhost:13306/imlate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
#       IMLATE_REDIS_PORT=16379
# =====================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: imlate-mysql
    restart: unless-stopped
    ports:
      - "${IMLATE_MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: imlate
      MYSQL_USER: imlate
      MYSQL_PASSWORD: imlate
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
      - --skip-character-set-client-handshake
    volumes:
      - imlate-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: imlate-redis
    restart: unless-stopped
    ports:
      - "${IMLATE_REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    environment:
      TZ: Asia/Seoul
    volumes:
      - imlate-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  imlate-mysql-data:
    name: imlate-mysql-data
  imlate-redis-data:
    name: imlate-redis-data
