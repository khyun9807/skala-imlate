# =====================================================================
# imlate — 서비스 location 모음 (server 컨텍스트에 include 된다)
#
#   배치 위치: /etc/nginx/imlate/app-locations.conf
#
#   :80(인증서 없을 때)과 :443(인증서 있을 때) 두 서버 블록이 이 파일 하나를
#   공유한다. 그래서 서비스 규칙을 한 곳에서만 고치면 된다.
#
#   ※ 이 파일은 server 블록 "안"에 include 되므로 server { } 로 감싸지 않는다.
#
#   반영: sudo nginx -t && sudo systemctl reload nginx
# =====================================================================

root  /var/www/imlate;
index index.html;
charset utf-8;

# 등록 요청 본문은 수백 바이트 수준 — 1m 이면 충분히 넉넉하다.
client_max_body_size  1m;
client_body_timeout   10s;
client_header_timeout 10s;
limit_conn imlate_conn 40;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# gzip 은 server 컨텍스트에만 둔다(배포판 기본 nginx.conf 와 중복되지 않도록).
gzip              on;
gzip_vary         on;
gzip_min_length   1024;
gzip_comp_level   5;
gzip_proxied      any;
gzip_types        text/plain text/css text/javascript application/javascript
                  application/json application/xml image/svg+xml font/woff font/woff2;

# ---------------- 백엔드 API ----------------
location /api/ {
    limit_req zone=imlate_api burst=20 nodelay;

    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    proxy_buffering       on;
}

# ---------------- 배포 확인용 공개 헬스체크 ----------------
#   ALB 가 없어졌으므로 배포 스크립트가 밖에서 두드릴 지점이 하나 필요하다.
#   /actuator/health/alb 그룹은 db + ping 만 보고 show-details: never 라
#   본문이 {"status":"UP"} 뿐이다(내부 정보가 새지 않는다).
#   Redis 를 뺀 그룹이라 ElastiCache 장애 때도 UP 을 유지한다 — 의도된 동작이다.
location = /healthz {
    access_log off;

    proxy_pass http://127.0.0.1:8080/actuator/health/alb;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout    5s;
}

# ---------------- actuator (내부 전용) ----------------
#   ALB 가 사라진 뒤에는 사실상 "이 인스턴스 자신 + VPC 내부"만 통과한다.
#   외부에서 온 요청은 공인 IP 이므로 전부 403 이다.
#   운영자가 봐야 하면 SSM Session Manager 로 붙어 curl 127.0.0.1 로 조회한다.
location /actuator/ {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    access_log off;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---------------- 정적 자산 ----------------
# Vite 는 dist/assets/*.[hash].js 형태로 산출하므로 장기 캐시가 안전하다.
location /assets/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
}

location ~* \.(?:js|css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|webp|ico)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
}

# SPA 진입점은 캐시하지 않는다(배포 즉시 반영)
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

# ---------------- SPA 폴백 (/lookup 등 클라이언트 라우트) ----------------
location / {
    try_files $uri $uri/ /index.html;
}
