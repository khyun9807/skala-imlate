# =====================================================================
# imlate — nginx 설정
#
#   배치 위치: /etc/nginx/conf.d/imlate.conf
#   (AL2023 기본 nginx.conf 는 http 컨텍스트에서 conf.d/*.conf 를 server 블록보다
#    먼저 include 하므로, 이 블록이 80번 포트의 default_server 가 된다.)
#
#   역할
#     1) 프론트엔드 빌드 산출물(frontend/dist) 정적 서빙 + SPA 폴백
#     2) /api/  → Spring Boot(127.0.0.1:8080) 리버스 프록시
#     3) 기본 방어: limit_req 10r/s (burst 20), limit_conn, client_max_body_size 1m
#     4) 캐시 헤더: 해시 붙은 자산은 장기 캐시, index.html 은 no-cache
#
#   ※ 레이트 리밋 3중 구조
#      WAF(IP당 5분 2000요청) → nginx(10r/s) → 애플리케이션 Redis 토큰 버킷(엔드포인트별)
#      여기 값은 "인스턴스 한 대를 지키는" 최후 방어선이라 애플리케이션 리미터보다 넉넉하다.
#      정상 사용자는 등록 한 번에 요청 2~3개(window 조회 + 등록 + 통계)면 충분하다.
#
#   반영: sudo nginx -t && sudo systemctl reload nginx
# =====================================================================

# IP 별 요청률 제한 (10 MB ≈ 16만 IP 추적)
limit_req_zone $binary_remote_addr zone=imlate_api:10m rate=10r/s;
limit_req_status 429;

# IP 별 동시 연결 제한
limit_conn_zone $binary_remote_addr zone=imlate_conn:10m;
limit_conn_status 429;

server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    root  /var/www/imlate;
    index index.html;
    charset utf-8;

    # 등록 요청 본문은 수백 바이트 수준 — 1m 이면 충분히 넉넉하다.
    client_max_body_size  1m;
    client_body_timeout   10s;
    client_header_timeout 10s;
    limit_conn imlate_conn 40;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml font/woff font/woff2;

    # ---------------- 백엔드 API ----------------
    location /api/ {
        limit_req zone=imlate_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_buffering       on;
    }

    # ---------------- 헬스체크 (ALB / 내부에서만) ----------------
    location /actuator/health {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny  all;

        access_log off;
        proxy_pass http://127.0.0.1:8080/actuator/health;
        proxy_set_header Host $host;
    }

    # ---------------- 정적 자산 ----------------
    # Vite 는 dist/assets/*.[hash].js 형태로 산출하므로 장기 캐시가 안전하다.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # SPA 진입점은 캐시하지 않는다(배포 즉시 반영)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------------- SPA 폴백 (/lookup 등 클라이언트 라우트) ----------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
