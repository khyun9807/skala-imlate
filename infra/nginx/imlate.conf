# =====================================================================
# imlate — nginx 진입 설정 (http 컨텍스트 + :80 서버)
#
#   배치 위치: /etc/nginx/conf.d/imlate.conf
#   (AL2023 기본 nginx.conf 는 http 컨텍스트에서 conf.d/*.conf 를 먼저 include 하므로
#    이 블록이 80번 포트의 default_server 가 된다.)
#
#   구성
#     인터넷 → EIP → 이 nginx → /var/www/imlate 정적 서빙 + 127.0.0.1:8080 프록시
#     ALB 는 쓰지 않는다. TLS 종단도 여기(Let's Encrypt)에서 한다.
#
#   파일 구성 — 인증서가 "있을 때/없을 때" 모두 nginx 가 떠야 하므로 include 로 쪼갠다.
#
#     /etc/nginx/conf.d/imlate.conf          ← 이 파일. http 설정 + :80 서버
#     /etc/nginx/imlate/app-locations.conf   ← 실제 서비스 location 모음(imlate-app.conf)
#     /etc/nginx/imlate/http-mode-*.conf     ← imlate-tls-sync.sh 가 둘 중 하나만 생성
#         · http-mode-plain.conf    : 인증서 없음 → :80 이 그대로 서비스
#         · http-mode-redirect.conf : 인증서 있음 → :80 은 443 으로 301
#     /etc/nginx/imlate/tls-server.conf      ← 인증서가 있을 때만 생성되는 :443 서버
#
#   와일드카드 include 는 일치하는 파일이 없어도 오류가 아니다. 즉 인증서 발급이
#   실패해도 nginx 는 정상 기동하고 80 포트로 서비스가 계속된다.
#
#   반영: sudo nginx -t && sudo systemctl reload nginx
#         (또는 sudo /usr/local/bin/imlate-tls-sync.sh — 인증서 상태까지 함께 맞춘다)
# =====================================================================

# ---------------------------------------------------------------------
# http 컨텍스트 공통 설정
# ---------------------------------------------------------------------

# IP 별 요청률 제한 (10 MB ≈ 16만 IP 추적)
#
#   레이트 리밋 2단 구조 (ALB/WAF 를 걷어냈으므로 이제 두 겹이다)
#     1단 nginx(여기)                : /api 10r/s, burst 20 — 인스턴스를 지키는 최후 방어선
#     2단 애플리케이션 Redis 토큰 버킷 : 엔드포인트별 정밀 제어(등록 8회/분 등)
#   정상 사용자는 등록 한 번에 요청 2~3개면 충분하다.
limit_req_zone $binary_remote_addr zone=imlate_api:10m rate=10r/s;
limit_req_status 429;

# IP 별 동시 연결 제한
limit_conn_zone $binary_remote_addr zone=imlate_conn:10m;
limit_conn_status 429;

# ※ http 컨텍스트에는 zone 선언만 둔다.
#   gzip / server_tokens 같은 값은 배포판 기본 nginx.conf 와 중복되면 기동이 실패하므로
#   전부 server 컨텍스트(app-locations.conf, 아래 :80 블록)에서만 설정한다.

# ---------------------------------------------------------------------
# :443 — 인증서가 준비되면 imlate-tls-sync.sh 가 tls-server.conf 를 만든다.
#        (없으면 아무 일도 일어나지 않는다)
# ---------------------------------------------------------------------
include /etc/nginx/imlate/tls-*.conf;

# ---------------------------------------------------------------------
# :80 — 항상 뜬다
# ---------------------------------------------------------------------
server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    # 리다이렉트 모드일 때는 app-locations.conf 가 include 되지 않으므로 여기에 둔다.
    # (app-locations.conf 에도 넣으면 평문 모드에서 "directive is duplicate" 로 기동이 깨진다.)
    server_tokens off;

    # ACME HTTP-01 챌린지는 절대 443 으로 리다이렉트하면 안 된다(갱신 실패 원인 1위).
    # ^~ 를 붙여 정규식 location 보다 먼저 매칭시킨다.
    location ^~ /.well-known/acme-challenge/ {
        root       /var/www/acme;
        default_type "text/plain";
        access_log off;
        try_files  $uri =404;
    }

    # 인증서 유무에 따라 아래 둘 중 정확히 하나가 존재한다.
    #   http-mode-plain.conf    → include app-locations.conf (평문 서비스)
    #   http-mode-redirect.conf → location / { return 301 https://... }
    include /etc/nginx/imlate/http-mode-*.conf;
}
