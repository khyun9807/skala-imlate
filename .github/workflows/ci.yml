# =====================================================================
# CI — main 대상 PR / main 푸시에서 도는 검증 파이프라인
#
#   잡 3개를 병렬로 돌린다.
#     backend    JDK 21 + gradlew build (컴파일 + 단위/슬라이스 테스트)
#     frontend   node 20 + 타입체크 + 빌드 + Playwright E2E
#     terraform  fmt -check / validate  (AWS 자격증명 없이 도는 잡)
#
#   terraform 잡은 자격증명을 전혀 쓰지 않는다. `-backend=false` 로 init 하므로
#   원격 상태나 AWS API 를 건드리지 않고, 문법·타입·모듈 배선만 확인한다.
# =====================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에서 새 커밋이 오면 이전 실행은 취소한다(러너 시간 절약).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 기본 권한을 읽기로 낮춘다. CI 는 아무것도 쓰지 않는다.
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # 백엔드 — Spring Boot 3.4 / Java 21
  # -------------------------------------------------------------------
  backend:
    name: 백엔드 빌드·테스트
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설치 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # ~/.gradle/caches, ~/.gradle/wrapper 를 gradle 잠금 파일 기준으로 캐시한다.
          cache: gradle

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      - name: 빌드 + 테스트
        # --no-daemon: 러너는 일회용이라 데몬을 띄울 이유가 없다.
        run: ./gradlew --no-daemon --stacktrace build

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          # 경로는 working-directory 가 아니라 워크스페이스 루트 기준이다.
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
          retention-days: 7
          if-no-files-found: warn

  # -------------------------------------------------------------------
  # 프론트엔드 — Vue 3 / Vite / Playwright
  # -------------------------------------------------------------------
  frontend:
    name: 프론트엔드 검증
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          # package.json engines 가 >=20.19.0 이라 20 계열 최신을 쓴다(Vite 6 요구사항).
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 타입체크
        run: npm run typecheck

      - name: 프로덕션 빌드
        run: npm run build

      - name: Playwright 크로뮴 설치
        run: npx playwright install --with-deps chromium

      - name: E2E 테스트
        # playwright.config.ts 의 webServer 가 vite dev 서버를 띄우고, API 는 전부 목킹된다.
        # 즉 백엔드/DB 없이 돈다.
        run: npm run test:e2e

      - name: Playwright 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  # -------------------------------------------------------------------
  # Terraform — 포맷 / 문법 검증 (자격증명 불필요)
  # -------------------------------------------------------------------
  terraform:
    name: Terraform 검증
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # 루트와 각 모듈이 프로바이더를 매번 내려받지 않도록 공유 캐시를 쓴다.
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache
      TF_IN_AUTOMATION: 'true'

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Terraform 설치
        uses: hashicorp/setup-terraform@v3
        with:
          # 로컬 개발 환경과 같은 버전. 올릴 때는 이 값만 바꾼다.
          terraform_version: '1.15.8'
          # 래퍼가 stdout 을 가로채면 스크립트에서 출력을 다루기 번거로워진다.
          terraform_wrapper: false

      - name: 프로바이더 캐시 디렉터리 준비
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: 포맷 검사
        working-directory: infra/terraform
        run: terraform fmt -check -recursive -diff

      - name: 루트 모듈 init (백엔드 없이)
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false -no-color

      - name: 루트 모듈 validate
        working-directory: infra/terraform
        run: terraform validate -no-color

      - name: 하위 모듈 단독 validate
        # 루트에서 호출되지 않는 모듈(예: github-oidc)도 문법이 깨지지 않았는지 확인한다.
        working-directory: infra/terraform
        run: |
          for dir in modules/*/; do
            echo "::group::${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false -no-color
            terraform -chdir="${dir}" validate -no-color
            echo "::endgroup::"
          done
