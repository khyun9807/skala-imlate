<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 노치가 있는 아이폰에서도 안전영역까지 배경이 채워지도록 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14171b" media="(prefers-color-scheme: dark)" />
    <!--
      링크 미리보기(카카오톡·슬랙 등)에 뜨는 설명이다. 정적 HTML 이라 서버 설정을 읽지 못하므로
      마감 시각이 여기에 박혀 있다. `imlate.registration.close-time` 을 바꾸면 **이 줄도 함께 고쳐야 한다.**
      (화면 안의 시각은 서버 window 응답을 쓰므로 자동으로 따라간다 — 여기만 예외다)
    -->
    <meta name="description" content="기숙사 야간 복귀(23:30) 등록 시스템. 21:45까지 반·이름·호수를 등록하세요." />
    <meta property="og:title" content="기숙사 야간 복귀 등록" />
    <meta property="og:description" content="21:45까지 등록하면 23:30 일괄 개방 때 함께 입관합니다. 반·이름·호수를 입력하세요." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex, nofollow" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c5fd6'/%3E%3Cpath d='M16 7v9l6 3.5' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E"
    />
    <title>기숙사 야간 복귀 등록</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 1rem; font-family: system-ui, sans-serif">
        이 페이지는 자바스크립트가 필요합니다. 브라우저 설정에서 자바스크립트를 허용해 주세요.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
