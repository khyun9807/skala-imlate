# =====================================================================
# 운영 프로파일 (AWS EC2 + RDS MySQL 8 + ElastiCache Redis 7 + SES + Aligo)
#
#   기본값을 두지 않는다. 아래 환경변수가 없으면 애플리케이션이 기동에 실패한다.
#   값은 SSM Parameter Store(SecureString) → EC2 user_data → 환경변수 경로로 주입하거나
#   ./config/application-secret.yml 파일로 제공한다.
#
#   필수 환경변수:
#     IMLATE_DB_URL, IMLATE_DB_USERNAME, IMLATE_DB_PASSWORD
#     IMLATE_REDIS_HOST, IMLATE_REDIS_PORT, IMLATE_REDIS_PASSWORD
#     IMLATE_LOOKUP_BASE_URL, IMLATE_LOOKUP_TOKEN_SECRET, IMLATE_ADMIN_API_KEY
#     IMLATE_WEB_ALLOWED_ORIGIN_1
#     IMLATE_ALIGO_API_KEY, IMLATE_ALIGO_USER_ID, IMLATE_ALIGO_SENDER
#     IMLATE_SES_REGION, IMLATE_SES_FROM
#     IMLATE_SUPERVISOR1_NAME/PHONE/EMAIL, IMLATE_SUPERVISOR2_NAME/PHONE/EMAIL
# =====================================================================

spring:
  datasource:
    url: "${IMLATE_DB_URL}"
    username: "${IMLATE_DB_USERNAME}"
    password: "${IMLATE_DB_PASSWORD}"
    hikari:
      maximum-pool-size: ${IMLATE_DB_POOL_MAX:20}
      minimum-idle: ${IMLATE_DB_POOL_MIN_IDLE:4}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  data:
    redis:
      host: "${IMLATE_REDIS_HOST}"
      port: ${IMLATE_REDIS_PORT}
      password: "${IMLATE_REDIS_PASSWORD}"
      ssl:
        enabled: ${IMLATE_REDIS_SSL_ENABLED:true}

server:
  port: ${IMLATE_SERVER_PORT:8080}
  # ALB 뒤에서 X-Forwarded-* 헤더를 신뢰한다.
  forward-headers-strategy: framework

# 운영에서는 노출을 최소화한다(헬스체크만 공개).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.skala.imlate: INFO
    org.hibernate.SQL: WARN

imlate:
  timezone: "${IMLATE_TIMEZONE:Asia/Seoul}"

  lookup:
    base-url: "${IMLATE_LOOKUP_BASE_URL}"
    token-secret: "${IMLATE_LOOKUP_TOKEN_SECRET}"
    token-ttl-hours: ${IMLATE_LOOKUP_TOKEN_TTL_HOURS:48}

  admin:
    api-key: "${IMLATE_ADMIN_API_KEY}"

  web:
    allowed-origins:
      - "${IMLATE_WEB_ALLOWED_ORIGIN_1}"

  notification:
    enabled: ${IMLATE_NOTIFICATION_ENABLED:true}
    supervisors:
      - name: "${IMLATE_SUPERVISOR1_NAME}"
        phone: "${IMLATE_SUPERVISOR1_PHONE}"
        email: "${IMLATE_SUPERVISOR1_EMAIL}"
      - name: "${IMLATE_SUPERVISOR2_NAME}"
        phone: "${IMLATE_SUPERVISOR2_PHONE}"
        email: "${IMLATE_SUPERVISOR2_EMAIL}"

  sms:
    provider: aligo
    aligo:
      api-url: "${IMLATE_ALIGO_API_URL:https://apis.aligo.in/send/}"
      api-key: "${IMLATE_ALIGO_API_KEY}"
      user-id: "${IMLATE_ALIGO_USER_ID}"
      sender: "${IMLATE_ALIGO_SENDER}"
      test-mode: ${IMLATE_ALIGO_TEST_MODE:false}

  email:
    provider: ses
    ses:
      region: "${IMLATE_SES_REGION}"
      from: "${IMLATE_SES_FROM}"
      from-name: "${IMLATE_SES_FROM_NAME:기숙사 야간복귀 시스템}"
      configuration-set: "${IMLATE_SES_CONFIGURATION_SET:}"

  rate-limit:
    enabled: true
    fail-open: true

  stats:
    enabled: true
