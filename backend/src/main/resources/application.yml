# =====================================================================
# imlate 공통 설정 (모든 프로파일 공통 기본값)
#
# R10: 인프라·외부 의존성이 바뀌어도 "설정 파일/환경변수만" 고치면 되도록
#      호스트·포트·키·리전을 전부 프로퍼티화한다.
#      비밀값은 ${ENV_VAR:기본값} 플레이스홀더로 두고, 실제 값은
#      환경변수 또는 ./config/application-secret.yml 로 주입한다.
# =====================================================================

spring:
  application:
    name: imlate

  # 프로파일은 실행 시점에 지정한다(여기서 고정하지 않는다 — 테스트의 @ActiveProfiles 와 충돌 방지).
  #   로컬:  --spring.profiles.active=local   (또는 SPRING_PROFILES_ACTIVE=local)
  #   운영:  --spring.profiles.active=prod
  # 프로파일 없이 실행해도 아래 기본값만으로 동작한다(localhost MySQL/Redis + noop 발송).

  # 운영자가 채워 넣는 비밀 설정 파일(없으면 무시). .gitignore 대상.
  config:
    import: "optional:file:./config/application-secret.yml"

  # ---------------- DataSource (MySQL 8 / AWS RDS) ----------------
  datasource:
    url: "${IMLATE_DB_URL:jdbc:mysql://localhost:3306/imlate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true}"
    username: "${IMLATE_DB_USERNAME:imlate}"
    password: "${IMLATE_DB_PASSWORD:imlate}"
    hikari:
      pool-name: imlate-hikari
      maximum-pool-size: ${IMLATE_DB_POOL_MAX:10}
      minimum-idle: ${IMLATE_DB_POOL_MIN_IDLE:2}
      connection-timeout: ${IMLATE_DB_CONNECTION_TIMEOUT_MS:5000}
      idle-timeout: 300000
      max-lifetime: 1140000

  # ---------------- JPA / Hibernate ----------------
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${IMLATE_JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
          batch_size: 30
        order_inserts: true
        format_sql: false

  # ---------------- Flyway 마이그레이션 ----------------
  flyway:
    enabled: ${IMLATE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ---------------- Redis (WAL / rate limit / stats) ----------------
  data:
    redis:
      host: "${IMLATE_REDIS_HOST:localhost}"
      port: ${IMLATE_REDIS_PORT:6379}
      password: "${IMLATE_REDIS_PASSWORD:}"
      database: ${IMLATE_REDIS_DATABASE:0}
      timeout: ${IMLATE_REDIS_TIMEOUT:2000ms}
      connect-timeout: ${IMLATE_REDIS_CONNECT_TIMEOUT:2000ms}
      client-name: imlate
      ssl:
        enabled: ${IMLATE_REDIS_SSL_ENABLED:false}
      lettuce:
        shutdown-timeout: 200ms
        pool:
          enabled: true
          max-active: ${IMLATE_REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${IMLATE_REDIS_POOL_MAX_IDLE:8}
          min-idle: ${IMLATE_REDIS_POOL_MIN_IDLE:1}
          max-wait: 1000ms

  mvc:
    problemdetails:
      enabled: false

  lifecycle:
    timeout-per-shutdown-phase: 20s

# ---------------- 서버 (교육생 200명 규모에 충분) ----------------
server:
  port: ${IMLATE_SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: ${IMLATE_FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  tomcat:
    threads:
      max: 100
      min-spare: 10
    accept-count: 100
    max-connections: 2000
    connection-timeout: 5s
    uri-encoding: UTF-8

# ---------------- Actuator ----------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        # ALB/로드밸런서 전용 헬스 그룹 (/actuator/health/alb).
        # Redis 는 일부러 제외한다 — WAL/통계/rate limit 은 Redis 없이도 성능 저하만 되고
        # 등록 자체는 계속 처리되므로(가용성 우선 설계), ElastiCache 장애로 인스턴스를
        # 서비스에서 빼면 오히려 서비스 전체가 죽는다. DB 는 등록에 필수이므로 포함한다.
        alb:
          include: db, ping
          show-details: never
  info:
    env:
      enabled: false

logging:
  level:
    root: INFO
    com.skala.imlate: INFO

# =====================================================================
# imlate 서비스 설정
# =====================================================================
imlate:
  timezone: "${IMLATE_TIMEZONE:Asia/Seoul}"

  # 등록 창: [open-time, close-time) — 21:45 정각부터 등록 거부
  #
  # 하루 타임라인(이 값들의 근거):
  #   00:00 등록 시작 → 21:45 등록 마감 → 21:50 사감 발송(+5분) → 22:30 통금(문 잠김)
  #   → 23:30 일괄 개방
  #   · 마감(21:45)과 발송(21:50) 사이 5분은 마감 직전 등록분이 DB 에 안착하고
  #     WAL↔DB 대사가 끝나는 데 쓴다. 명단이 빠지면 교육생이 밖에서 밤을 새운다.
  #   · 21:45 이후에는 그날 등록이 닫히고, 자정(00:00)에 다음 날 대상 등록이 열린다.
  #   · 마감만 앞당겼고 통금(22:30)·일괄 개방(23:30)은 그대로다(안내 문구용 값).
  registration:
    open-time: "00:00"
    close-time: "${IMLATE_REGISTRATION_CLOSE_TIME:21:45}"
    return-time: "${IMLATE_REGISTRATION_RETURN_TIME:23:30}"
    curfew-time: "${IMLATE_REGISTRATION_CURFEW_TIME:22:30}"
    max-name-length: 20
    max-room-length: 20

  # Redis WAL (R7: DB 기록 전 선행 로깅)
  wal:
    key-prefix: "imlate:wal"
    ttl-days: ${IMLATE_WAL_TTL_DAYS:7}

  # 사감 조회 페이지 (R8, R9)
  lookup:
    base-url: "${IMLATE_LOOKUP_BASE_URL:http://localhost:5173}"
    token-secret: "${IMLATE_LOOKUP_TOKEN_SECRET:}"
    token-ttl-hours: ${IMLATE_LOOKUP_TOKEN_TTL_HOURS:48}

  # 관리 API 보호 키 (X-Admin-Key)
  admin:
    api-key: "${IMLATE_ADMIN_API_KEY:}"

  # CORS 허용 오리진
  web:
    allowed-origins:
      - "${IMLATE_WEB_ALLOWED_ORIGIN_1:http://localhost:5173}"
      - "${IMLATE_WEB_ALLOWED_ORIGIN_2:http://localhost:4173}"

  # 사감 발송 (R3, R9) — 21:50 발송, 실패분 22:05/22:20 재시도
  #
  #   cron 은 6필드(초 분 시 일 월 요일)다. 5필드로 쓰면 기동 시 바인딩에 실패한다.
  #   · dispatch 21:50  = 등록 마감(21:45) + 5분. 마감분 안착·대사 완료 후 발송한다.
  #   · retry   22:05,22:20 = 발송 +15분 / +30분. 둘 다 통금(22:30) 전이라
  #     사감이 문을 잠그기 전에 명단을 받는다.
  #     ※ 재시도 두 시각은 반드시 같은 "시"에 두어야 한 식으로 표현된다.
  #       21:55 와 22:05 를 "0 55,5 21,22 * * *" 로 쓰면 21:05·21:55·22:05·22:55
  #       네 번(발송 전 포함) 실행되므로 쓰면 안 된다.
  notification:
    enabled: ${IMLATE_NOTIFICATION_ENABLED:true}
    dispatch-cron: "${IMLATE_NOTIFICATION_DISPATCH_CRON:0 50 21 * * *}"
    retry-cron: "${IMLATE_NOTIFICATION_RETRY_CRON:0 5,20 22 * * *}"
    max-attempts: ${IMLATE_NOTIFICATION_MAX_ATTEMPTS:3}
    lock-ttl-seconds: ${IMLATE_NOTIFICATION_LOCK_TTL_SECONDS:300}
    # 문자·메일 말미의 문의처 안내. 운영진이 바뀌면 코드 수정 없이 여기(또는 환경변수)만 고친다.
    contact-name: "${IMLATE_NOTIFICATION_CONTACT_NAME:SKALA 운영진}"
    contact-email: "${IMLATE_NOTIFICATION_CONTACT_EMAIL:khdev07@naver.com}"
    # 사감 2명. 실제 연락처는 환경변수 또는 application-secret.yml 로 주입한다.
    supervisors:
      - name: "${IMLATE_SUPERVISOR1_NAME:사감A}"
        phone: "${IMLATE_SUPERVISOR1_PHONE:}"
        email: "${IMLATE_SUPERVISOR1_EMAIL:}"
      - name: "${IMLATE_SUPERVISOR2_NAME:사감B}"
        phone: "${IMLATE_SUPERVISOR2_PHONE:}"
        email: "${IMLATE_SUPERVISOR2_EMAIL:}"

    # 운영자 알림 — 발송에 실패했는데 아무도 모르는 상황을 없앤다.
    #
    #   ※ 수신처는 사감과 반드시 분리한다. 사감에게 가는 것은 "오늘 밤 복귀 명단"뿐이어야 한다.
    #     운영 알림이 사감에게 섞이면 사감이 명단 문자와 혼동해 진짜 명단을 놓칠 수 있다.
    #   ※ phone 기본값이 비어 있는 이유: 잘못된 번호를 넣으면 그 문자는 사감에게 간다.
    #     "설정하지 않으면 문자 알림 없음"이 안전한 기본값이다(메일만으로도 운영자는 인지한다).
    #     혹시 사감 번호와 같은 값이 들어오면 앱이 발송을 거부하고 오류 로그만 남긴다.
    ops-alert:
      enabled: ${IMLATE_NOTIFICATION_OPS_ALERT_ENABLED:true}
      # 비우면 위 contact-email 을 그대로 쓴다.
      email: "${IMLATE_NOTIFICATION_OPS_ALERT_EMAIL:}"
      # 비워 둘 것. 문자 알림이 꼭 필요할 때만 운영자 개인 번호를 넣는다.
      phone: "${IMLATE_NOTIFICATION_OPS_ALERT_PHONE:}"
      # 성공까지 매일 알리면 알림 피로가 생겨 정작 실패 알림을 무시하게 된다.
      notify-on-success: ${IMLATE_NOTIFICATION_OPS_ALERT_NOTIFY_ON_SUCCESS:false}

    # 발송 완료 하트비트 — 21:50 에 "아무 일도 일어나지 않은 경우"(인스턴스 다운)를 밖에서 감지한다.
    #   앱은 발송을 끝냈다는 신호만 남기고, 신호가 오지 않는 것을 CloudWatch 알람이 판정한다.
    #   현재 구현은 정해진 형식의 로그 한 줄이며, 로그 지표 필터가 지표로 바꾼다
    #   (LogDispatchHeartbeatPublisher 주석에 필터 패턴이 있다).
    heartbeat:
      enabled: ${IMLATE_NOTIFICATION_HEARTBEAT_ENABLED:true}
      # log = 로그만 / cloudwatch = PutMetricData 로 실제 지표 발행 / none = 끔
      publisher: "${IMLATE_NOTIFICATION_HEARTBEAT_PUBLISHER:log}"
      namespace: "${IMLATE_NOTIFICATION_HEARTBEAT_NAMESPACE:Imlate}"
      environment: "${IMLATE_ENV:local}"

  # 문자 발송 (R11) — aligo | noop
  sms:
    provider: "${IMLATE_SMS_PROVIDER:noop}"
    aligo:
      api-url: "${IMLATE_ALIGO_API_URL:https://apis.aligo.in/send/}"
      api-key: "${IMLATE_ALIGO_API_KEY:}"
      user-id: "${IMLATE_ALIGO_USER_ID:}"
      sender: "${IMLATE_ALIGO_SENDER:}"
      test-mode: ${IMLATE_ALIGO_TEST_MODE:true}
      connect-timeout-ms: 3000
      read-timeout-ms: 5000
      # 잔여 건수가 이 값 미만이면 WARN 로그 + 운영자 알림. 0 이하면 감시하지 않는다.
      #   발송 직후 하루 1회만 조회한다(매 발송마다 외부 호출을 늘릴 이유가 없다).
      #   100건 근거: 사감 2명 × 하루 1회 = 2건/일이므로 약 50일치 여유다.
      #   충전에 필요한 시간(영업일 처리)을 감안해도 충분히 이르게 알 수 있다.
      low-balance-threshold: ${IMLATE_ALIGO_LOW_BALANCE_THRESHOLD:100}

  # 이메일 발송 (R11) — ses | noop
  email:
    provider: "${IMLATE_EMAIL_PROVIDER:noop}"
    ses:
      region: "${IMLATE_SES_REGION:ap-northeast-2}"
      from: "${IMLATE_SES_FROM:}"
      from-name: "${IMLATE_SES_FROM_NAME:기숙사 야간복귀 시스템}"
      configuration-set: "${IMLATE_SES_CONFIGURATION_SET:}"

  # ---------------------------------------------------------------------
  # Rate limit (R14) — 기숙사 공용 와이파이(NAT) 200명 기준
  #
  # 전제: 교육생 전원이 기숙사 공용 와이파이 한 회선을 쓴다 = 서버에서 보면 공인 IP 가 1개다.
  #       그래서 "IP 당 N회" 를 사람 단위 제한으로 쓰면 N+1번째 학생부터 429 가 되고,
  #       하필 21:45 마감 직전에 정상 사용자가 막힌다(실서비스 불가).
  #
  # 해결: 버킷 축을 둘로 나눈다.
  #   · IP 축(global/register/lookup) — 한 회선에서의 비정상 폭주(스크립트·DDoS)만 막는 굵은 그물.
  #   · 사람 축(register-person)      — 요청 본문의 "반|이름|호수" 해시 기준. 도배는 여기서 막는다.
  # ---------------------------------------------------------------------
  rate-limit:
    enabled: ${IMLATE_RATE_LIMIT_ENABLED:true}
    fail-open: ${IMLATE_RATE_LIMIT_FAIL_OPEN:true}

    # [IP] 모든 /api 요청. 200명 × 6회/분 ≈ 1,200
    #   (등록 창 조회 1 + 요약 1 + 앱 전환 시 재조회 1~2 + 등록 1~2)
    #   이 값을 넘는 트래픽은 사람이 아니라 스크립트다.
    global:
      capacity: ${IMLATE_RATE_LIMIT_GLOBAL_CAPACITY:1200}
      refill-tokens: ${IMLATE_RATE_LIMIT_GLOBAL_REFILL:1200}
      refill-period-seconds: ${IMLATE_RATE_LIMIT_GLOBAL_PERIOD:60}

    # [IP] 등록 API. 200명 × 1.5회 = 300
    #   1.5회는 "오타 수정 후 재제출 / 새로고침 후 재시도" 여유다.
    #   200~400 중 300 을 고른 이유: 400 은 회선 폭주 방어가 느슨해지고, 200 은 재시도 여유가 0 이라
    #   마감 직전 동시 재시도에서 정상 사용자가 막힐 수 있다. 개인 도배는 아래 register-person 이 막으므로
    #   이 값은 "사람 수 × 재시도"만 감당하면 된다.
    register:
      capacity: ${IMLATE_RATE_LIMIT_REGISTER_CAPACITY:300}
      refill-tokens: ${IMLATE_RATE_LIMIT_REGISTER_REFILL:300}
      refill-period-seconds: ${IMLATE_RATE_LIMIT_REGISTER_PERIOD:60}

    # [사람] 같은 사람(반|이름|호수)의 등록 시도. 10회/분 (SPEC §8.6)
    #   정상 사용자는 1~3회면 끝난다(성공 / 오타 수정 / 결과 재확인).
    #   통신 오류 재시도까지 넉넉히 잡아도 10회이며, 분당 10회를 넘기면 사람이 아니라 스크립트다.
    #   반드시 register(IP) 한도보다 작아야 한다 — 같으면 개인 도배를 방치하는 셈이다.
    #   버킷 키는 개인정보 평문이 아니라 HMAC-SHA256 앞 32자다(PersonKeyResolver 주석 참고).
    register-person:
      capacity: ${IMLATE_RATE_LIMIT_REGISTER_PERSON_CAPACITY:10}
      refill-tokens: ${IMLATE_RATE_LIMIT_REGISTER_PERSON_REFILL:10}
      refill-period-seconds: ${IMLATE_RATE_LIMIT_REGISTER_PERSON_PERIOD:60}

    # [IP] 사감 조회 API. 40 → 120 으로 올린다.
    #   사용자는 사감 2명뿐이지만 이 버킷도 결국 IP 축이다. 사감 둘이 같은 사무실/기숙사 회선을
    #   쓰면 하나의 버킷을 나눠 쓰게 되므로, "사람 수 × 조작 횟수"로 잡으면 이번에 고친 것과
    #   똑같은 실수를 반복하게 된다. 조회·검색·새로고침·인쇄를 반복해도 닿지 않을 값으로 둔다.
    #   (링크 남용 방지는 조회 토큰 자체와 TTL 이 담당한다)
    lookup:
      capacity: ${IMLATE_RATE_LIMIT_LOOKUP_CAPACITY:120}
      refill-tokens: ${IMLATE_RATE_LIMIT_LOOKUP_REFILL:120}
      refill-period-seconds: ${IMLATE_RATE_LIMIT_LOOKUP_PERIOD:60}

    # 신뢰 프록시(IP 또는 IPv4 CIDR). 기본은 "아무도 신뢰하지 않음".
    #   비어 있으면 X-Forwarded-For 를 아예 보지 않고 remoteAddr 만 쓴다.
    #   XFF 는 누구나 붙일 수 있는 헤더라, 무조건 신뢰하면 요청마다 다른 값을 넣어
    #   IP 버킷을 무한히 만들어 내는 우회가 가능하다. 프록시 뒤에 둘 때만 그 프록시 주소를 넣는다.
    trusted-proxies: []

    # Redis 장애 시 쓰는 인메모리 폴백의 분당 상한(키 1개 기준). global 과 같은 수준으로 맞춘다.
    #   폴백 리미터는 모든 규칙에 min(규칙 한도, 이 값)을 적용한다. 따라서 이 값이 작으면
    #   Redis 가 죽는 순간 global/register 한도가 통째로 이 값으로 줄어들어
    #   공용 와이파이 전체가 막힌다 — 이번에 고친 결함이 장애 중에 그대로 되살아나는 셈이다.
    #   (register-person=10 처럼 이보다 작은 규칙은 규칙 값이 그대로 유지된다)
    local-fallback-permits-per-minute: ${IMLATE_RATE_LIMIT_LOCAL_FALLBACK_PER_MINUTE:1200}

  # 통계 (R15)
  stats:
    enabled: ${IMLATE_STATS_ENABLED:true}
    retention-days: ${IMLATE_STATS_RETENTION_DAYS:400}
    snapshot-cron: "${IMLATE_STATS_SNAPSHOT_CRON:0 5 0 * * *}"
