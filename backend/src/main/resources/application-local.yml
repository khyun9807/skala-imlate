# =====================================================================
# 로컬 개발 프로파일
#   docker-compose.yml 의 MySQL 8 / Redis 7 을 사용한다.
#   문자·이메일은 실제로 발송하지 않는 noop 구현을 쓴다.
#   실행: docker compose up -d  →  ./gradlew bootRun
# =====================================================================

spring:
  datasource:
    url: "${IMLATE_DB_URL:jdbc:mysql://localhost:3306/imlate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}"
    username: "${IMLATE_DB_USERNAME:imlate}"
    password: "${IMLATE_DB_PASSWORD:imlate}"
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    # 스키마는 Flyway 가 만들고 JPA 는 검증만 한다.
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  data:
    redis:
      host: "${IMLATE_REDIS_HOST:localhost}"
      port: ${IMLATE_REDIS_PORT:6379}
      password: ""
      ssl:
        enabled: false

server:
  port: ${IMLATE_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,configprops
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.skala.imlate: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

imlate:
  # Vite 개발 서버(5173)와 프리뷰 서버(4173) 허용
  web:
    allowed-origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "http://localhost:4173"

  lookup:
    base-url: "${IMLATE_LOOKUP_BASE_URL:http://localhost:5173}"
    token-secret: "${IMLATE_LOOKUP_TOKEN_SECRET:local-dev-lookup-secret-change-me}"
    token-ttl-hours: 168

  admin:
    api-key: "${IMLATE_ADMIN_API_KEY:local-dev-admin-key}"

  # 로컬에서는 실제 발송 금지
  sms:
    provider: noop
  email:
    provider: noop

  notification:
    # noop 발송이라 실제로 문자/메일이 나가지 않는다. 스케줄 동작 확인을 위해 켜 둔다.
    enabled: ${IMLATE_NOTIFICATION_ENABLED:true}
    supervisors:
      - name: "사감A"
        phone: "01000000001"
        email: "supervisor-a@example.com"
      - name: "사감B"
        phone: "01000000002"
        email: "supervisor-b@example.com"

  rate-limit:
    enabled: true
    fail-open: true
