# =====================================================================
# 로컬 개발 프로파일
#   docker-compose.yml 의 MySQL 8 / Redis 7 을 사용한다.
#   문자·이메일은 실제로 발송하지 않는 noop 구현을 쓴다.
#   실행: docker compose up -d  →  ./gradlew bootRun
# =====================================================================

spring:
  datasource:
    url: "${IMLATE_DB_URL:jdbc:mysql://localhost:3306/imlate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}"
    username: "${IMLATE_DB_USERNAME:imlate}"
    password: "${IMLATE_DB_PASSWORD:imlate}"
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    # 스키마는 Flyway 가 만들고 JPA 는 검증만 한다.
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  data:
    redis:
      host: "${IMLATE_REDIS_HOST:localhost}"
      port: ${IMLATE_REDIS_PORT:6379}
      password: ""
      ssl:
        enabled: false

server:
  port: ${IMLATE_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,configprops
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.skala.imlate: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

imlate:
  # Vite 개발 서버(5173)와 프리뷰 서버(4173) 허용
  web:
    allowed-origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "http://localhost:4173"

  lookup:
    base-url: "${IMLATE_LOOKUP_BASE_URL:http://localhost:5173}"
    token-secret: "${IMLATE_LOOKUP_TOKEN_SECRET:local-dev-lookup-secret-change-me}"
    token-ttl-hours: 168

  admin:
    api-key: "${IMLATE_ADMIN_API_KEY:local-dev-admin-key}"

  # 로컬에서는 실제 발송 금지
  sms:
    provider: noop
  email:
    provider: noop

  notification:
    # noop 발송이라 실제로 문자/메일이 나가지 않는다. 스케줄 동작 확인을 위해 켜 둔다.
    enabled: ${IMLATE_NOTIFICATION_ENABLED:true}
    supervisors:
      - name: "사감A"
        phone: "01000000001"
        email: "supervisor-a@example.com"
      - name: "사감B"
        phone: "01000000002"
        email: "supervisor-b@example.com"

    # 로컬에서도 운영자 알림 흐름을 눈으로 확인할 수 있게 켜 둔다(발송기는 noop 이라 로그만 찍힌다).
    ops-alert:
      enabled: ${IMLATE_NOTIFICATION_OPS_ALERT_ENABLED:true}
      email: "ops-local@example.com"
      # 로컬에서도 비워 둔다 — 문자 알림 경로는 실수하기 쉬운 곳이다.
      phone: ""
      notify-on-success: ${IMLATE_NOTIFICATION_OPS_ALERT_NOTIFY_ON_SUCCESS:false}

    # 로컬은 CloudWatch 로 보낼 곳이 없다. 끈다(자격증명 없이도 기동해야 한다).
    heartbeat:
      # 로컬에는 AWS 자격증명이 없을 수 있으므로 발행하지 않는다.
      enabled: false
      publisher: "none"
      namespace: "Imlate"
      environment: "local"

  rate-limit:
    enabled: true
    fail-open: true
    # 로컬은 프록시가 없으므로 아무것도 신뢰하지 않는다(= X-Forwarded-For 무시).
    #   scripts/integration-test.mjs §3-3 이 "위조 XFF 로 만들어진 버킷이 없음"을 단언하므로
    #   이 목록은 반드시 비어 있어야 한다.
    #   그 대신 scripts/load-test.mjs 는 사전 점검에서 XFF 신뢰 여부를 감지해
    #   "IP 분산 기준선" 단계를 건너뛴다(어차피 실사용 환경은 단일 IP 다).
    #   IP 를 흩뿌리는 부하 시험이 꼭 필요하면 이 목록에 "127.0.0.1/32" 를 임시로 넣는다.
    trusted-proxies: []
